# Unica configuracion local: el nombre de la aplicacion (con el que se busca
# el archivo en el Config Server y con el que se registra en Eureka) y la
# direccion del Config Server. Todo lo demas se resuelve de forma centralizada.
spring.application.name=bancoxyz-bff-web
spring.config.import=configserver:http://localhost:8888

# Alternativa para arrancar sin Config Server (no usar en la evidencia):
#spring.config.import=optional:configserver:http://localhost:8888
