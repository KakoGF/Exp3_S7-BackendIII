# ============================================================
# ms-validaciones: reglas de negocio y antifraude (consumidor Kafka)
# ============================================================

# Puerto por defecto 8094. La segunda instancia se levanta con:
#   mvn spring-boot:run "-Dspring-boot.run.arguments=--PUERTO=8095"
server.port=${PUERTO:8094}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.kafka.consumer.group-id=bancoxyz-ms-validaciones

# --- Reglas de validacion ---
validaciones.limite.web=1000000
validaciones.limite.movil=500000
validaciones.limite.cajero=200000
validaciones.cajero.multiplo-retiro=1000
validaciones.tipos-cuenta-sin-retiro=PRESTAMO,HIPOTECA
validaciones.antifraude.max-solicitudes=5
validaciones.antifraude.ventana-segundos=60

# Tiempo de procesamiento simulado, para que se note el reparto entre instancias
validaciones.latencia-simulada-ms=400

# --- Seguridad: usuario de servicio para las estadisticas ---
seguridad.servicio.usuario=svc-validaciones
seguridad.servicio.clave=Validaciones-2026

logging.level.cl.duoc.bancoxyz.ms=DEBUG
logging.level.org.apache.kafka=WARN
