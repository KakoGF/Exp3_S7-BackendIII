# ============================================================
# Configuracion compartida por todos los microservicios
# Servida por el Config Server a cualquier cliente que la pida
# ============================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# --- Actuator: estado de los mecanismos de resiliencia ---
management.endpoints.web.exposure.include=health,info,circuitbreakers,ratelimiters
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true

# ============================================================
# Semana 7: arquitectura de eventos con Apache Kafka
# ============================================================

# Broker levantado con docker-compose.yml (raiz del proyecto)
spring.kafka.bootstrap-servers=localhost:9092

# Productor: acks=all, igual que el ejemplo de la semana (kafka-batch-sample).
# max.block.ms en 3 segundos para que, si Kafka esta caido, el envio falle
# rapido y actue el Circuit Breaker en vez de quedarse esperando 60 segundos.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000

# Consumidor: si el grupo es nuevo, parte leyendo desde el primer mensaje
spring.kafka.consumer.auto-offset-reset=earliest

# Reintentos controlados: 3 reintentos cada 2 segundos. Si igual falla, el
# mensaje se mueve al topico <nombre>.DLT para no bloquear la particion.
kafka.consumidor.reintentos=3
kafka.consumidor.intervalo-ms=2000

# Topicos de la saga (la clave de cada mensaje es el cuentaId)
topicos.movimientos-solicitados=bancoxyz.movimientos.solicitados
topicos.movimientos-validados=bancoxyz.movimientos.validados
topicos.movimientos-finalizados=bancoxyz.movimientos.finalizados
