# ============================================================
# ms-cuentas: backend de negocio (cuentas y movimientos)
# ============================================================

server.port=8090

spring.datasource.url=jdbc:h2:mem:bancoxyz_ms_cuentas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.cl.duoc.bancoxyz.ms=DEBUG

# --- Seguridad: ms-cuentas ahora exige Basic Auth ---
# Este es el usuario de servicio con el que los BFF se autentican al llamarlo.
seguridad.servicio.usuario=svc-cuentas
seguridad.servicio.clave=Cuentas-2026

# --- Tolerancia a fallos: RateLimiter sobre el listado ---
# ms-cuentas no llama a nadie mas, asi que no tiene de que protegerse con un
# Circuit Breaker hacia afuera. Lo que si necesita es protegerse de un exceso
# de solicitudes de sus consumidores: sobre 20 por segundo, el exceso se
# rechaza con 429 en vez de sobrecargar el servicio.
resilience4j.ratelimiter.instances.msCuentasApi.limit-for-period=20
resilience4j.ratelimiter.instances.msCuentasApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.msCuentasApi.timeout-duration=0s

# ============================================================
# Semana 7: saga de movimientos (productor y consumidor Kafka)
# ============================================================
spring.kafka.consumer.group-id=bancoxyz-ms-cuentas

# --- Tolerancia a fallos hacia Kafka ---
# Si falla la mitad de las ultimas 6 publicaciones, el circuito se abre por
# 20 segundos y el fallback responde 503 sin intentar publicar.
resilience4j.circuitbreaker.instances.kafkaBroker.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaBroker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaBroker.sliding-window-size=6
resilience4j.circuitbreaker.instances.kafkaBroker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.kafkaBroker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaBroker.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.kafkaBroker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafkaBroker.automatic-transition-from-open-to-half-open-enabled=true

logging.level.org.apache.kafka=WARN
